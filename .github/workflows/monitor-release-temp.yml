name: monitor-release-temp

on:
  push:
    branches: [main]
    paths: [.github/workflows/monitor-release-temp.yml]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - name: Clean accidental connector probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list -R "$GITHUB_REPOSITORY" --state open --head dummy --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr close "$pr_number" -R "$GITHUB_REPOSITORY" --comment "Closed: connector write-path probe; no product changes." || true
          fi
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" refs/heads/dummy >/dev/null 2>&1; then
            git push "$remote" --delete dummy
          fi

      - name: Find dispatched release run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 60); do
            run_id="$(gh run list -R "$GITHUB_REPOSITORY" --workflow frontron-release.yml --branch main --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$run_id" ]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "No frontron-release run appeared." >&2
          exit 1

      - name: Wait for release and record exact result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.release.outputs.run_id }}
        run: |
          gh run watch "$RUN_ID" -R "$GITHUB_REPOSITORY" --interval 10 --exit-status || true
          conclusion="$(gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion // "unknown"')"
          create_version="$(npm view create-frontron version 2>/dev/null || true)"
          frontron_version="$(npm view frontron version 2>/dev/null || true)"
          body=$(cat <<EOF
          Release workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}
          Conclusion: ${conclusion}
          npm create-frontron latest: ${create_version:-unavailable}
          npm frontron latest: ${frontron_version:-unavailable}
          EOF
          )
          gh issue create -R "$GITHUB_REPOSITORY" --title "Temporary Frontron release result ${RUN_ID}" --body "$body"

      - name: Remove this one-time monitor
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .github/workflows/monitor-release-temp.yml ]; then
            git rm .github/workflows/monitor-release-temp.yml
            git commit -m "chore: remove temporary release monitor"
            git push origin main
          fi
