name: Verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22']
        # The newest Node line ships npm 12, whose `npm pack --json` output and
        # registry rules differ from npm 10/11. Keep one job on it so those
        # changes surface here instead of on contributor machines.
        include:
          - os: ubuntu-latest
            node: '26'
    name: quality (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Verify from a clean checkout including real desktop execution
        env:
          FRONTRON_TEST_ELECTRON_RUNTIME: '1'
        run: node release.mjs verify
