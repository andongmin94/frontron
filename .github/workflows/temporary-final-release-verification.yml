name: temporary-final-release-verification

on:
  issues:
    types: [opened]

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: frontron-npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.issue.title == 'Run final Frontron release verification'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: npm

    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install headless Electron runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Use the audited npm CLI
        run: npm install --global npm@11.18.0

      - name: Install package-manager smoke tools
        run: npm install --global --allow-scripts=bun pnpm@11.11.0 @yarnpkg/cli-dist@4.9.2 bun@1.3.14

      - name: Verify, publish, and reinstall both packages
        run: node release.mjs publish
        env:
          FRONTRON_TRUSTED_PUBLISHING: "1"
          FRONTRON_TEST_ELECTRON_RUNTIME: "1"
          FRONTRON_TEST_PACKAGE_MANAGERS: "1"

      - name: Record success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Final release verification succeeded. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue close "${{ github.event.issue.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --reason completed

      - name: Record failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Final release verification failed. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
