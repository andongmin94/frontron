name: temporary-main-validation

on:
  push:
    branches:
      - main
    paths:
      - "frontron/**"
      - "create-frontron/**"
      - "release.mjs"
      - ".github/workflows/temporary-main-validation.yml"
  issue_comment:
    types:
      - created

permissions:
  contents: write

concurrency:
  group: temporary-main-validation
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'push' || github.event.comment.body == '/validate-main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontron/package-lock.json
            create-frontron/package-lock.json

      - name: Track generated parent directories in rollback
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'frontron/src/transaction-journal.ts'
          let source = fs.readFileSync(path, 'utf8')

          function replaceOnce(before, after, label) {
            const count = source.split(before).length - 1
            if (count !== 1) throw new Error(`${label}: expected one match, found ${count}`)
            source = source.replace(before, after)
          }

          replaceOnce(
            'throw new Error(`Transaction target appeared after planning: ${path}`)',
            'throw new Error(`Transaction target changed after the transaction plan was created (appeared after planning): ${path}`)',
            'appeared target message',
          )
          replaceOnce(
            'throw new Error(`Transaction target changed after planning: ${path}`)',
            'throw new Error(`Transaction target changed after the transaction plan was created (changed after planning): ${path}`)',
            'changed target message',
          )

          const before = [
            '  const snapshots = new Map<string, TransactionSnapshot>()',
            '',
            '  for (const target of targets) {',
            '    const snapshot = snapshotTarget(projectRoot, target)',
            '    const existing = snapshots.get(snapshot.path)',
            '',
            '    if (existing) {',
            '      if (existing.safetyRoot !== snapshot.safetyRoot || existing.kind !== snapshot.kind) {',
            '        throw new Error(`Transaction target was planned inconsistently: ${snapshot.path}`)',
            '      }',
            '      continue',
            '    }',
            '',
            '    snapshots.set(snapshot.path, snapshot)',
            '  }',
          ].join('\n')

          const after = [
            '  const snapshots = new Map<string, TransactionSnapshot>()',
            '',
            '  function addSnapshot(target: TransactionTarget) {',
            '    const snapshot = snapshotTarget(projectRoot, target)',
            '    const existing = snapshots.get(snapshot.path)',
            '',
            '    if (existing) {',
            '      if (existing.safetyRoot !== snapshot.safetyRoot || existing.kind !== snapshot.kind) {',
            '        throw new Error(`Transaction target was planned inconsistently: ${snapshot.path}`)',
            '      }',
            '      return',
            '    }',
            '',
            '    snapshots.set(snapshot.path, snapshot)',
            '  }',
            '',
            '  for (const target of targets) {',
            "    if ((target.kind ?? 'file') === 'file') {",
            '      const safetyRoot = resolve(target.safetyRoot)',
            '      let parentPath = dirname(resolve(target.path))',
            '',
            '      while (parentPath !== safetyRoot && isInsideDirectory(safetyRoot, parentPath)) {',
            "        addSnapshot({ path: parentPath, safetyRoot, kind: 'directory' })",
            '        parentPath = dirname(parentPath)',
            '      }',
            '    }',
            '',
            '    addSnapshot(target)',
            '  }',
          ].join('\n')

          replaceOnce(before, after, 'snapshot planning')
          fs.writeFileSync(path, source)
          NODE

      - name: Format and validate both packages
        shell: bash
        run: |
          set +e

          run_validation() {
            node release.mjs check-metadata &&
            (
              cd create-frontron &&
              npm ci --fund=false --audit=false &&
              npm run lint &&
              npm run check &&
              npm run typecheck &&
              npm test &&
              npm run build &&
              npm run test:package-smoke
            ) &&
            (
              cd frontron &&
              npm ci --fund=false --audit=false &&
              npm run lint &&
              npm run check &&
              npm run typecheck &&
              npm test &&
              npm run build &&
              npm run test:package-smoke
            )
          }

          run_validation 2>&1 | tee /tmp/frontron-validation.log
          status=${PIPESTATUS[0]}
          tail -c 60000 /tmp/frontron-validation.log > /tmp/frontron-validation-tail.log

          STATUS="$status" VALIDATED_SHA="$(git rev-parse HEAD)" node <<'NODE'
          const fs = require('node:fs')
          const result = {
            status: Number(process.env.STATUS),
            validatedSha: process.env.VALIDATED_SHA,
            completedAt: new Date().toISOString(),
            log: fs.readFileSync('/tmp/frontron-validation-tail.log', 'utf8'),
          }
          fs.writeFileSync(
            '.github/temporary-main-validation-result.json',
            `${JSON.stringify(result, null, 2)}\n`,
          )
          NODE

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            .github/temporary-main-validation-result.json \
            frontron/__tests__/pnpm-workspace-yaml.spec.ts \
            frontron/__tests__/yarnrc-yaml.spec.ts \
            frontron/src/init/pnpm-workspace-yaml.ts \
            frontron/src/init/yarnrc-yaml.ts \
            frontron/src/transaction-journal.ts
          git commit -m "chore: apply temporary validation fixes" || true
          git push origin HEAD:main

          exit 0
