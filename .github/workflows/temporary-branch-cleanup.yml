name: temporary-branch-cleanup

on:
  pull_request_target:
    types: [reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: >-
      github.event.pull_request.number == 66 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'cleanup/final-volume-trim'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Remove this one-shot workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temporary-branch-cleanup.yml
          git commit -m "chore: remove temporary branch cleanup workflow"
          git push origin HEAD:main

      - name: Close the validation PR and delete its branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/66" -f state=closed >/dev/null
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/cleanup/final-volume-trim"
