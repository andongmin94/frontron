name: temporary-current-package-manager-smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-current-package-manager-smoke.yml"

permissions:
  contents: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout current main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build repository packages
        run: |
          npm ci --fund=false --audit=false --prefix create-frontron
          npm ci --fund=false --audit=false --prefix frontron
          npm run build --prefix create-frontron
          npm run build --prefix frontron

      - name: Install package managers
        run: npm install --global --allow-scripts=bun pnpm@11.11.0 @yarnpkg/cli-dist@4.9.2 bun@1.3.14

      - name: Run current consumer smoke
        id: smoke
        continue-on-error: true
        run: node scripts/package-manager-smoke.mjs

      - name: Record result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$OUTCOME" = "success" ]; then
            gh issue comment 100 --body "Current pnpm/Yarn/Bun smoke succeeded. Run: ${run_url}"
            gh issue close 100 --reason completed
          else
            gh issue comment 100 --body "Current pnpm/Yarn/Bun smoke failed. Run: ${run_url}"
            gh issue close 100 --reason "not planned"
          fi

      - name: Remove this one-time workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-current-package-manager-smoke.yml
          git commit -m "chore: remove current package-manager validation workflow"
          git push origin HEAD:main

      - name: Preserve validation failure status
        if: steps.smoke.outcome != 'success'
        run: exit 1
