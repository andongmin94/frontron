name: Review maintenance
on:
  push:
    branches: [main]
    paths: [.github/workflows/review-maintenance.yml]
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            // 사용자가 삭제를 요청한 병합 완료 브랜치만 정리한다.
            if (context.ref !== 'refs/heads/main') throw new Error('Main only');
            const repo = context.repo;
            const branch = 'fix/recovery-and-release-safety';
            const expected = '4c1d88b193525cb9bc83ef742e72c554805e5bf5';
            const {data: main} = await github.rest.git.getRef({...repo, ref: 'heads/main'});
            let old;
            try { old = (await github.rest.git.getRef({...repo, ref: `heads/${branch}`})).data; }
            catch (error) { if (error.status === 404) { core.info('Already removed'); return; } throw error; }
            if (old.object.sha !== expected) throw new Error('Branch changed since review');
            const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({...repo, basehead: `${expected}...${main.object.sha}`});
            if (comparison.merge_base_commit.sha !== expected) throw new Error('Branch not fully merged');
            await github.rest.git.deleteRef({...repo, ref: `heads/${branch}`});
            const branches = await github.paginate(github.rest.repos.listBranches, {...repo, per_page: 100});
            core.info(JSON.stringify(branches.map(item => item.name)));
            if (branches.length !== 1 || branches[0].name !== 'main') throw new Error('Unexpected remaining branch');
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare tracked source and locked review tools
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar HEAD > "$RUNNER_TEMP/review-source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/review-sha.txt"
          npm ci --prefix create-frontron --fund=false --audit=false
          npm ci --prefix frontron --fund=false --audit=false
          tar -czf "$RUNNER_TEMP/review-tools.tgz" create-frontron/node_modules frontron/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: offline-code-review
          path: |
            ${{ runner.temp }}/review-source.tar
            ${{ runner.temp }}/review-tools.tgz
            ${{ runner.temp }}/review-sha.txt
          retention-days: 1
