name: format-probe

on:
  pull_request:
    paths:
      - 'frontron/**'
      - '.github/workflows/format-probe.yml'

permissions:
  contents: read

jobs:
  frontron-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontron/package-lock.json
      - run: npm ci
        working-directory: frontron
      - name: Print formatter patch
        working-directory: frontron
        run: |
          npm run lint
          git diff -- src/init/package-json.ts src/workspace-project.ts
          test -z "$(git status --short -- src/init/package-json.ts src/workspace-project.ts)"
