name: temporary-package-manager-diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-package-manager-diagnostic.yml"

permissions:
  issues: write
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Create diagnostic issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh issue create \
            --title "Temporary package-manager diagnostic ${GITHUB_RUN_ID}" \
            --body "Diagnostic run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Apply pending product changes
        run: |
          python3 .github/temporary-frontron-hardening.py
          python3 .github/temporary-frontron-hardening-v4.py
          python3 .github/temporary-frontron-hardening-v6.py
          python3 .github/temporary-frontron-hardening-v7.py

      - name: Install repository dependencies
        run: |
          npm ci --fund=false --audit=false --prefix create-frontron
          npm ci --fund=false --audit=false --prefix frontron

      - name: Run focused package-manager smoke
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/package-manager-smoke.mjs 2>&1 | tee /tmp/package-manager-smoke.log

      - name: Publish diagnostic tail
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '```text'
            tail -n 180 /tmp/package-manager-smoke.log 2>/dev/null || true
            echo '```'
          } > /tmp/diagnostic-comment.md
          gh issue comment "${{ steps.issue.outputs.number }}" --body-file /tmp/diagnostic-comment.md
          if [ "${{ steps.smoke.outcome }}" = "success" ]; then
            gh issue close "${{ steps.issue.outputs.number }}" --reason completed --comment "Focused package-manager smoke passed."
          fi

      - name: Fail when the smoke failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
