name: frontron-release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/release-0134-trigger"

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: frontron-npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: npm

    steps:
      - name: Require main
        shell: bash
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Require the current main commit
        shell: bash
        run: |
          git fetch --no-tags --force origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install headless Electron runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Use the audited npm CLI
        run: npm install --global npm@11.18.0

      - name: Verify and publish both packages
        id: release
        continue-on-error: true
        run: node release.mjs publish
        env:
          FRONTRON_TRUSTED_PUBLISHING: "1"
          FRONTRON_TEST_ELECTRON_RUNTIME: "1"

      - name: Record release result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.release.outcome }}
        shell: bash
        run: |
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          create_version="$(npm view create-frontron version 2>/dev/null || printf unavailable)"
          frontron_version="$(npm view frontron version 2>/dev/null || printf unavailable)"
          gh issue comment 104 --body "Release outcome: ${OUTCOME}\n\nRun: ${run_url}\n\nRegistry versions:\n- create-frontron: ${create_version}\n- frontron: ${frontron_version}"
          if [ "$OUTCOME" = "success" ] && [ "$create_version" = "0.13.4" ] && [ "$frontron_version" = "0.13.4" ]; then
            gh issue close 104 --reason completed
          else
            gh issue close 104 --reason "not planned"
          fi

      - name: Preserve release failure status
        if: steps.release.outcome != 'success'
        run: exit 1
