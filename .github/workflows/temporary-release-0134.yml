name: temporary-release-0134

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-release-0134.yml"

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: frontron-npm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: npm

    steps:
      - name: Checkout current main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install headless Electron runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Install audited release tools
        run: |
          npm install --global npm@11.18.0
          npm install --global --allow-scripts=bun pnpm@11.11.0 @yarnpkg/cli-dist@4.9.2 bun@1.3.14

      - name: Verify and publish both packages
        id: publish
        continue-on-error: true
        run: node release.mjs publish
        env:
          FRONTRON_TRUSTED_PUBLISHING: "1"
          FRONTRON_TEST_ELECTRON_RUNTIME: "1"
          FRONTRON_TEST_PACKAGE_MANAGERS: "1"

      - name: Record release result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.publish.outcome }}
        run: |
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$OUTCOME" = "success" ]; then
            gh issue comment 97 --body "npm 0.13.4 release attempt succeeded. Run: ${run_url}"
            gh issue close 97 --reason completed
          else
            gh issue comment 97 --body "npm 0.13.4 release attempt failed. Run: ${run_url}"
            gh issue close 97 --reason not_planned
          fi

      - name: Remove this one-time workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-release-0134.yml
          git commit -m "chore: remove one-time npm release workflow"
          git push origin HEAD:main

      - name: Preserve release failure status
        if: steps.publish.outcome != 'success'
        run: exit 1
