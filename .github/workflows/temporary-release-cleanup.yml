name: temporary-final-cleanup

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: temporary-final-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event.pull_request.title == 'Run final main cleanup' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout the temporary cleanup branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontron/package-lock.json
            create-frontron/package-lock.json

      - name: Apply both cleanup layers
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/cleanup-request
          python3 .github/temporary-release-cleanup.py
          python3 .github/temporary-final-cleanup.py
          rm -f \
            .github/cleanup-request \
            .github/temporary-release-cleanup.py \
            .github/temporary-final-cleanup.py \
            .github/temporary-release-cleanup-result.json \
            .github/workflows/temporary-release-cleanup.yml

      - name: Install packages
        run: |
          npm ci --fund=false --audit=false --prefix create-frontron
          npm ci --fund=false --audit=false --prefix frontron

      - name: Format changed sources
        run: |
          npm run lint --prefix create-frontron
          npm run lint --prefix frontron

      - name: Verify metadata and create-frontron
        run: |
          node release.mjs check-metadata
          npm run check --prefix create-frontron
          npm run typecheck --prefix create-frontron
          npm run coverage --prefix create-frontron
          npm run build --prefix create-frontron
          npm run test:package-smoke --prefix create-frontron
          npm run test:release-smoke --prefix create-frontron

      - name: Verify frontron
        run: |
          npm run check --prefix frontron
          npm run typecheck --prefix frontron
          npm run coverage --prefix frontron
          npm run build --prefix frontron
          npm run test:package-smoke --prefix frontron

      - name: Commit the validated cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: finish codebase volume cleanup"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Squash merge and delete the temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" \
            --squash \
            --delete-branch \
            --subject "refactor: finish codebase volume cleanup" \
            --body "Remove the remaining release-harness, JSONC, template-loader, CI, and duplicate-test bloat after full package validation."
