name: Verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Verify from a clean checkout including real desktop execution
        env:
          FRONTRON_TEST_ELECTRON_RUNTIME: '1'
        run: node release.mjs verify
