name: frontron-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontron/**"
      - "create-frontron/**"
      - "scripts/**"
      - "release.mjs"
      - "LICENSE.md"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "frontron/**"
      - "create-frontron/**"
      - "scripts/**"
      - "release.mjs"
      - "LICENSE.md"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  quality:
    name: full quality / ubuntu / node 24
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontron/package-lock.json
            create-frontron/package-lock.json

      - name: Install headless Electron runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Install package-manager smoke tools
        run: npm install --global --allow-scripts=bun pnpm@11.11.0 @yarnpkg/cli-dist@4.9.2 bun@1.3.14

      - name: Verify repository, packed artifacts, and package-manager consumers
        run: node release.mjs verify
        env:
          FRONTRON_TEST_ELECTRON_RUNTIME: "1"
          FRONTRON_TEST_PACKAGE_MANAGERS: "1"

  runtime:
    name: runtime / ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.15.0"
          - os: ubuntu-latest
            node: "26"
          - os: macos-latest
            node: "24"
          - os: windows-latest
            node: "24"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            frontron/package-lock.json
            create-frontron/package-lock.json

      - name: Install packages
        run: |
          npm ci --fund=false --audit=false --prefix create-frontron
          npm ci --fund=false --audit=false --prefix frontron

      - name: Test create-frontron
        run: |
          npm run typecheck --prefix create-frontron
          npm test --prefix create-frontron
          npm run build --prefix create-frontron

      - name: Test frontron
        run: |
          npm run typecheck --prefix frontron
          npm test --prefix frontron
          npm run build --prefix frontron

      - name: Package a generated starter on the desktop host
        if: matrix.os == 'macos-latest' || matrix.os == 'windows-latest'
        run: npm run test:release-smoke --prefix create-frontron
