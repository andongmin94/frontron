name: temporary-release-0134

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-release-0134.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontron-npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: npm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install headless Electron runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
      - name: Use the audited npm CLI
        run: npm install --global npm@11.18.0
      - name: Verify, publish, and reinstall both packages
        run: node release.mjs publish
        env:
          FRONTRON_TRUSTED_PUBLISHING: "1"
          FRONTRON_TEST_ELECTRON_RUNTIME: "1"
