name: apply-create-frontron-cleanup

on:
  push:
    branches:
      - refactor/simplify-create-frontron
    paths:
      - .github/workflows/apply-create-frontron-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refactor/simplify-create-frontron

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Update matrix invocation and lockfile
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('create-frontron/scripts/release-matrix-smoke.mjs')
          source = path.read_text(encoding='utf-8')
          old = "runNpm(['exec', '--', 'create-frontron', appName, '--overwrite', 'yes'], root)"
          new = "runNpm(['exec', '--', 'create-frontron', appName], root)"

          if source.count(old) != 1:
              raise SystemExit('Expected exactly one legacy create-frontron overwrite invocation.')

          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          npm --prefix create-frontron install --package-lock-only --ignore-scripts --fund=false --audit=false
          npm --prefix create-frontron ci --ignore-scripts --fund=false --audit=false
          (
            cd create-frontron
            npm exec -- oxlint --fix \
              src/index.ts \
              src/scaffold.ts \
              __tests__/cli.spec.ts \
              __tests__/scaffold.spec.ts \
              __tests__/template-smoke.spec.ts \
              __tests__/release-rehearsal.spec.ts \
              scripts/release-matrix-smoke.mjs
            npm exec -- oxfmt \
              src/index.ts \
              src/scaffold.ts \
              __tests__/cli.spec.ts \
              __tests__/scaffold.spec.ts \
              __tests__/template-smoke.spec.ts \
              __tests__/release-rehearsal.spec.ts \
              scripts/release-matrix-smoke.mjs
            npm run typecheck
            npm test
          )
          rm .github/workflows/apply-create-frontron-cleanup.yml
        working-directory: .

      - name: Commit generated updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/apply-create-frontron-cleanup.yml \
            create-frontron/package-lock.json \
            create-frontron/scripts/release-matrix-smoke.mjs \
            create-frontron/src/index.ts \
            create-frontron/src/scaffold.ts \
            create-frontron/__tests__/cli.spec.ts \
            create-frontron/__tests__/scaffold.spec.ts \
            create-frontron/__tests__/template-smoke.spec.ts \
            create-frontron/__tests__/release-rehearsal.spec.ts
          git commit -m "chore: refresh simplified generator fixtures"
          git push origin HEAD:refactor/simplify-create-frontron
