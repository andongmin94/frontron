name: Temporary lockfile maintenance
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  refresh:
    if: github.repository == 'andongmin94/frontron' && github.event.pull_request.number == 105 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/recovery-and-release-safety'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate only the audited lockfiles without lifecycle scripts
        run: |
          npm audit fix --package-lock-only --ignore-scripts --fund=false --prefix create-frontron
          npm audit fix --package-lock-only --ignore-scripts --fund=false --prefix frontron
          git diff --exit-code -- create-frontron/package.json frontron/package.json
          git diff --stat
          git diff -- create-frontron/package-lock.json frontron/package-lock.json
      - name: Store immutable lockfile blobs for review without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in create-frontron/package-lock.json frontron/package-lock.json; do
            sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" -f encoding=utf-8 -F "content=@$file" --jq '.sha')
            echo "LOCKFILE_BLOB $file $sha"
          done
