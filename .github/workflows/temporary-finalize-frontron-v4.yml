name: temporary-finalize-frontron-v4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-finalize-frontron-v4.yml"

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Publish observable run status
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh issue create \
            --title "Temporary finalization v4 run ${GITHUB_RUN_ID}" \
            --body "Applies and validates the final Frontron product changes without the redundant external package-manager matrix. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          echo "issue_number=${url##*/}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontron/package-lock.json
            create-frontron/package-lock.json

      - name: Install headless Electron runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Apply reviewed product changes
        run: |
          python3 .github/temporary-frontron-hardening.py
          python3 .github/temporary-frontron-hardening-v4.py
          python3 .github/temporary-frontron-hardening-v6.py
          python3 .github/temporary-frontron-hardening-v7.py
          python3 .github/temporary-frontron-hardening-v8.py

      - name: Remove redundant external package-manager matrix
        run: |
          rm -f scripts/package-manager-smoke.mjs
          rmdir scripts 2>/dev/null || true
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('.github/workflows/frontron-ci.yml')
          source = path.read_text(encoding='utf-8')
          patterns = [
              r'\n[ \t]*- name: Install package-manager smoke tools\n[ \t]*run: npm install --global pnpm@11\.11\.0 @yarnpkg/cli-dist@4\.9\.2\n',
              r'\n[ \t]*- name: Verify pnpm and Yarn consumers\n[ \t]*run: (?:timeout 20m )?node scripts/package-manager-smoke\.mjs\n?',
          ]
          for pattern in patterns:
              source = re.sub(pattern, '\n', source, count=1)
          if 'package-manager-smoke.mjs' in source:
              raise SystemExit('package-manager smoke reference remains in CI')
          path.write_text(source, encoding='utf-8')
          PY

      - name: Refresh audit-fixable lockfile entries
        run: |
          npm --prefix create-frontron audit fix --package-lock-only --ignore-scripts
          npm --prefix frontron audit fix --package-lock-only --ignore-scripts

      - name: Verify repository, packed artifacts, and real Electron runtime
        run: node release.mjs verify
        env:
          FRONTRON_TEST_ELECTRON_RUNTIME: "1"

      - name: Remove all temporary automation
        run: |
          rm -f .github/temporary-frontron-hardening*.py
          rm -f .github/workflows/temporary-frontron-hardening*.yml
          rm -f .github/workflows/temporary-package-manager-diagnostic.yml
          rm -f .github/workflows/temporary-finalize-frontron*.yml

      - name: Commit validated product changes directly to main
        id: commit
        run: |
          git diff --check
          git add -- .github README.md release.mjs create-frontron frontron
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: complete runtime and package-manager hardening"
          git push origin HEAD:main
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Refresh repository description
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" \
            -f description="Electron starter and retrofit tooling for existing web frontends"

      - name: Close temporary validation issues
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for issue in 67 68 69 70 71 72 73 74 75 76 77; do
            gh issue close "$issue" --reason "not planned" \
              --comment "Temporary validation issue superseded by commit ${{ steps.commit.outputs.commit_sha }}." || true
          done
          gh issue close "${{ steps.status.outputs.issue_number }}" --reason completed \
            --comment "Validation succeeded and commit ${{ steps.commit.outputs.commit_sha }} was pushed to main."

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ steps.status.outputs.issue_number }}" \
            --body "Finalization failed. Inspect ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."

  validate:
    needs: finalize
    if: needs.finalize.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.15.0"
          - os: ubuntu-latest
            node: "26"
          - os: macos-latest
            node: "24"
          - os: windows-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.finalize.outputs.commit_sha }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            frontron/package-lock.json
            create-frontron/package-lock.json

      - name: Validate create-frontron
        working-directory: create-frontron
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build

      - name: Validate frontron
        working-directory: frontron
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build
