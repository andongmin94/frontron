name: frontron-release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/frontron-release.yml"

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: frontron-npm-release
  cancel-in-progress: true

jobs:
  publish:
    name: verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: npm

    steps:
      - name: Require main
        shell: bash
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Publish observable release status
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Temporary final npm release retry 3 ${GITHUB_RUN_ID}" \
            --body "Validates the current main HEAD, publishes Frontron 0.13.4, and verifies registry installation. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          echo "issue_number=${url##*/}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Require the current main commit
        shell: bash
        run: |
          git fetch --no-tags --force origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install headless Electron runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Use the audited npm CLI
        run: npm install --global npm@11.18.0

      - name: Install package-manager smoke tools
        run: npm install --global --allow-scripts=bun pnpm@11.11.0 @yarnpkg/cli-dist@4.9.2 bun@1.3.14

      - name: Verify and publish both packages
        run: node release.mjs publish
        env:
          FRONTRON_TRUSTED_PUBLISHING: "1"
          FRONTRON_TEST_ELECTRON_RUNTIME: "1"
          FRONTRON_TEST_PACKAGE_MANAGERS: "1"

      - name: Close successful release status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ steps.status.outputs.issue_number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Release verification, trusted publishing, and registry installation completed successfully."
          gh issue close "${{ steps.status.outputs.issue_number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --reason completed

      - name: Report release failure
        if: failure() && steps.status.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ steps.status.outputs.issue_number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Release failed. Inspect ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
