name: update-unified-build-smokes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'refactor/unify-build-native-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: refactor/unify-build-native-runtime
      - run: node .github/scripts/update-unified-build-smokes.mjs
      - run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            create-frontron/scripts/release-matrix-smoke.mjs \
            create-frontron/scripts/package-manager-matrix-smoke.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test: use unified build in release smokes"
          git push origin HEAD:refactor/unify-build-native-runtime
