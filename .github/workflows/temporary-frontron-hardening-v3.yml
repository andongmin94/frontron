name: temporary-frontron-hardening-v3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-frontron-hardening-v3.yml"

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: temporary-frontron-hardening-v3
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Publish observable run status
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh issue create \
            --title "Temporary hardening run ${GITHUB_RUN_ID}" \
            --body "Automated validation run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n\nBase commit: ${GITHUB_SHA}")
          echo "issue_number=${url##*/}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontron/package-lock.json
            create-frontron/package-lock.json

      - name: Install headless Electron runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Apply reviewed fixes
        run: |
          python3 .github/temporary-frontron-hardening.py
          rm -f \
            .github/workflows/temporary-frontron-hardening-v2.yml \
            .github/workflows/temporary-frontron-hardening-v3.yml
          python3 - <<'PY'
          from pathlib import Path
          import re

          header = Path('frontron/src/init/runtime/serve-source/header-config-source.ts')
          source = header.read_text(encoding='utf-8')
          marker = "  const nodeServerState = usesNodeServer"
          if marker not in source:
              raise SystemExit('nodeServerState insertion point was not found')
          if 'const nodeServerConstants = usesNodeServer' not in source:
              block = """  const nodeServerConstants = usesNodeServer
            ? `
          const NODE_SERVER_SOURCE_ROOT = readEmbeddedJson<string | null>(${embedJson(config.nodeServerSourceRoot)})
          const NODE_SERVER_SOURCE_ENTRY = readEmbeddedJson<string | null>(${embedJson(config.nodeServerSourceEntry ?? null)})
          const NODE_SERVER_ENTRY = readEmbeddedJson<string | null>(${embedJson(config.nodeServerEntry)})
          const NODE_SERVER_COPY_TARGETS = readEmbeddedJson<Array<{ from: string; to: string }>>(${embedJson(config.nodeServerCopyTargets)})`
            : ''
          """
              source = source.replace(marker, block + marker, 1)
          header.write_text(source, encoding='utf-8')

          serve = Path('create-frontron/template/src/electron/serve.ts')
          source = serve.read_text(encoding='utf-8')
          source, count = re.subn(
              r'\nconst loopbackHost = "127\.0\.0\.1"\n',
              '\n',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('obsolete loopbackHost constant was not found')
          serve.write_text(source, encoding='utf-8')

          package_smoke = Path('frontron/__tests__/package-smoke.spec.ts')
          source = package_smoke.read_text(encoding='utf-8')
          source, count = re.subn(
              r'\nfunction runNode\(args: string\[\], cwd: string\) \{.*?\n\}\n',
              '\n',
              source,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit('unused runNode helper was not found')
          package_smoke.write_text(source, encoding='utf-8')
          PY

      - name: Refresh audit-fixable lockfile entries
        run: |
          npm --prefix create-frontron audit fix --package-lock-only --ignore-scripts
          npm --prefix frontron audit fix --package-lock-only --ignore-scripts

      - name: Verify repository, packed artifacts, and real Electron runtime
        run: node release.mjs verify
        env:
          FRONTRON_TEST_ELECTRON_RUNTIME: "1"

      - name: Verify pnpm and Yarn consumers
        run: node scripts/package-manager-smoke.mjs

      - name: Validate the exact change set
        run: |
          python3 - <<'PY'
          import subprocess

          allowed = {
              '.github/temporary-frontron-hardening.py',
              '.github/workflows/frontron-ci.yml',
              '.github/workflows/frontron-release.yml',
              '.github/workflows/temporary-frontron-hardening-v2.yml',
              '.github/workflows/temporary-frontron-hardening-v3.yml',
              '.github/workflows/temporary-frontron-hardening.yml',
              'README.md',
              'release.mjs',
              'scripts/package-manager-smoke.mjs',
              'create-frontron/README.md',
              'create-frontron/package-lock.json',
              'create-frontron/src/index.ts',
              'create-frontron/src/scaffold.ts',
              'create-frontron/template/README.md',
              'create-frontron/template/index.html',
              'create-frontron/template/package.json',
              'create-frontron/template/scripts/tasks.mjs',
              'create-frontron/template/src/electron/ipc.ts',
              'create-frontron/template/src/electron/main.ts',
              'create-frontron/template/src/electron/serve.ts',
              'create-frontron/template/src/electron/static-server.ts',
              'create-frontron/template/src/electron/tray.ts',
              'create-frontron/template/src/electron/window.ts',
              'create-frontron/__tests__/cli.spec.ts',
              'create-frontron/__tests__/package-smoke.spec.ts',
              'create-frontron/__tests__/release-rehearsal.spec.ts',
              'create-frontron/__tests__/scaffold.spec.ts',
              'create-frontron/__tests__/template-smoke.spec.ts',
              'frontron/README.md',
              'frontron/package-lock.json',
              'frontron/package.json',
              'frontron/src/init/runtime/create-frontron-template.ts',
              'frontron/src/init/runtime/serve-source/header-config-source.ts',
              'frontron/src/init/runtime/serve-source/static-server-source.ts',
              'frontron/__tests__/package-smoke.spec.ts',
              'frontron/__tests__/runtime-security.spec.ts',
              'frontron/__tests__/runtime-serve-contract.spec.ts',
              'frontron/__tests__/runtime-serve.spec.ts',
          }
          output = subprocess.check_output(
              ['git', 'status', '--porcelain=v1', '--untracked-files=all'], text=True
          )
          changed = {line[3:] for line in output.splitlines() if line.strip()}
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit('Unexpected changed paths:\n' + '\n'.join(unexpected))
          for required in (
              'create-frontron/template/src/electron/static-server.ts',
              'scripts/package-manager-smoke.mjs',
          ):
              if required not in changed:
                  raise SystemExit(f'Expected change was not produced: {required}')
          print(output)
          PY
          git diff --check

      - name: Commit directly to main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/temporary-frontron-hardening.py \
            .github/workflows/frontron-ci.yml \
            .github/workflows/frontron-release.yml \
            .github/workflows/temporary-frontron-hardening-v2.yml \
            .github/workflows/temporary-frontron-hardening-v3.yml \
            .github/workflows/temporary-frontron-hardening.yml \
            README.md \
            release.mjs \
            scripts/package-manager-smoke.mjs \
            create-frontron/README.md \
            create-frontron/package-lock.json \
            create-frontron/src/index.ts \
            create-frontron/src/scaffold.ts \
            create-frontron/template/README.md \
            create-frontron/template/index.html \
            create-frontron/template/package.json \
            create-frontron/template/scripts/tasks.mjs \
            create-frontron/template/src/electron/ipc.ts \
            create-frontron/template/src/electron/main.ts \
            create-frontron/template/src/electron/serve.ts \
            create-frontron/template/src/electron/static-server.ts \
            create-frontron/template/src/electron/tray.ts \
            create-frontron/template/src/electron/window.ts \
            create-frontron/__tests__/cli.spec.ts \
            create-frontron/__tests__/package-smoke.spec.ts \
            create-frontron/__tests__/release-rehearsal.spec.ts \
            create-frontron/__tests__/scaffold.spec.ts \
            create-frontron/__tests__/template-smoke.spec.ts \
            frontron/README.md \
            frontron/package-lock.json \
            frontron/package.json \
            frontron/src/init/runtime/create-frontron-template.ts \
            frontron/src/init/runtime/serve-source/header-config-source.ts \
            frontron/src/init/runtime/serve-source/static-server-source.ts \
            frontron/__tests__/package-smoke.spec.ts \
            frontron/__tests__/runtime-security.spec.ts \
            frontron/__tests__/runtime-serve-contract.spec.ts \
            frontron/__tests__/runtime-serve.spec.ts
          git diff --cached --check
          git commit -m "fix: harden package-manager and desktop runtime support"
          git push origin HEAD:main
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Refresh repository description
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" \
            -f description="Electron starter and retrofit tooling for existing web frontends"

      - name: Close observable run status
        if: success() && steps.status.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ steps.status.outputs.issue_number }}" \
            --reason completed \
            --comment "Validation succeeded and commit ${{ steps.commit.outputs.commit_sha }} was pushed to main."

      - name: Report failed observable run
        if: failure() && steps.status.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ steps.status.outputs.issue_number }}" \
            --body "Validation failed. Inspect ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."

  validate:
    needs: apply
    if: needs.apply.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.15.0"
          - os: ubuntu-latest
            node: "26"
          - os: macos-latest
            node: "24"
          - os: windows-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.apply.outputs.commit_sha }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            frontron/package-lock.json
            create-frontron/package-lock.json

      - name: Install packages
        run: |
          npm ci --fund=false --audit=false --prefix create-frontron
          npm ci --fund=false --audit=false --prefix frontron

      - name: Test create-frontron
        run: |
          npm run typecheck --prefix create-frontron
          npm test --prefix create-frontron
          npm run build --prefix create-frontron

      - name: Test frontron
        run: |
          npm run typecheck --prefix frontron
          npm test --prefix frontron
          npm run build --prefix frontron
