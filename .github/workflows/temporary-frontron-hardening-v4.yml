name: temporary-frontron-hardening-v4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-frontron-hardening-v4.yml"

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Publish observable run status
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh issue create \
            --title "Temporary hardening run ${GITHUB_RUN_ID}" \
            --body "Automated validation run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n\nBase commit: ${GITHUB_SHA}")
          echo "issue_number=${url##*/}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontron/package-lock.json
            create-frontron/package-lock.json

      - name: Install headless Electron runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Apply reviewed changes
        run: |
          python3 .github/temporary-frontron-hardening.py
          python3 .github/temporary-frontron-hardening-v4.py

      - name: Refresh audit-fixable lockfile entries
        run: |
          npm --prefix create-frontron audit fix --package-lock-only --ignore-scripts
          npm --prefix frontron audit fix --package-lock-only --ignore-scripts

      - name: Verify repository, packed artifacts, and real Electron runtime
        run: node release.mjs verify
        env:
          FRONTRON_TEST_ELECTRON_RUNTIME: "1"

      - name: Verify pnpm and Yarn consumers
        run: node scripts/package-manager-smoke.mjs

      - name: Validate and commit directly to main
        id: commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/temporary-frontron-hardening.py \
            .github/temporary-frontron-hardening-v4.py \
            .github/workflows/frontron-ci.yml \
            .github/workflows/frontron-release.yml \
            .github/workflows/temporary-frontron-hardening.yml \
            .github/workflows/temporary-frontron-hardening-v2.yml \
            .github/workflows/temporary-frontron-hardening-v3.yml \
            .github/workflows/temporary-frontron-hardening-v4.yml \
            README.md \
            release.mjs \
            scripts/package-manager-smoke.mjs \
            create-frontron/README.md \
            create-frontron/package-lock.json \
            create-frontron/src/index.ts \
            create-frontron/src/scaffold.ts \
            create-frontron/template/README.md \
            create-frontron/template/index.html \
            create-frontron/template/package.json \
            create-frontron/template/scripts/tasks.mjs \
            create-frontron/template/src/electron/ipc.ts \
            create-frontron/template/src/electron/main.ts \
            create-frontron/template/src/electron/serve.ts \
            create-frontron/template/src/electron/static-server.ts \
            create-frontron/template/src/electron/tray.ts \
            create-frontron/template/src/electron/window.ts \
            create-frontron/__tests__/cli.spec.ts \
            create-frontron/__tests__/package-smoke.spec.ts \
            create-frontron/__tests__/release-rehearsal.spec.ts \
            create-frontron/__tests__/scaffold.spec.ts \
            create-frontron/__tests__/template-smoke.spec.ts \
            frontron/README.md \
            frontron/package-lock.json \
            frontron/package.json \
            frontron/src/init/runtime/create-frontron-template.ts \
            frontron/src/init/runtime/serve-source/header-config-source.ts \
            frontron/src/init/runtime/serve-source/static-server-source.ts \
            frontron/__tests__/framework-fixture-smoke.spec.ts \
            frontron/__tests__/package-smoke.spec.ts \
            frontron/__tests__/runtime-security.spec.ts \
            frontron/__tests__/runtime-serve-contract.spec.ts \
            frontron/__tests__/runtime-serve.spec.ts
          git diff --cached --check
          git commit -m "fix: harden package-manager and desktop runtime support"
          git push origin HEAD:main
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Refresh repository description
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" \
            -f description="Electron starter and retrofit tooling for existing web frontends"

      - name: Close run status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ steps.status.outputs.issue_number }}" \
            --reason completed \
            --comment "Validation succeeded and commit ${{ steps.commit.outputs.commit_sha }} was pushed to main."

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ steps.status.outputs.issue_number }}" \
            --body "Validation failed. Inspect ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."

  validate:
    needs: apply
    if: needs.apply.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.15.0"
          - os: ubuntu-latest
            node: "26"
          - os: macos-latest
            node: "24"
          - os: windows-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.apply.outputs.commit_sha }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            frontron/package-lock.json
            create-frontron/package-lock.json

      - name: Install packages
        run: |
          npm ci --fund=false --audit=false --prefix create-frontron
          npm ci --fund=false --audit=false --prefix frontron

      - name: Test create-frontron
        run: |
          npm run typecheck --prefix create-frontron
          npm test --prefix create-frontron
          npm run build --prefix create-frontron

      - name: Test frontron
        run: |
          npm run typecheck --prefix frontron
          npm test --prefix frontron
          npm run build --prefix frontron
