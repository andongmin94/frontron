name: temporary-remove-legacy-locks

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-remove-legacy-locks.yml"

permissions:
  contents: write

jobs:
  update-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontron/package-lock.json
            create-frontron/package-lock.json

      - name: Remove obsolete lock compatibility
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          function update(path, transform) {
            const before = fs.readFileSync(path, 'utf8')
            const after = transform(before)
            if (after === before) throw new Error(`No changes produced for ${path}`)
            fs.writeFileSync(path, after)
          }

          update('frontron/src/transaction-journal.ts', (source) => {
            const block = `// Doctor also reports stale artifacts left by older releases; current transactions use only the journal.
export const TRANSACTION_JOURNAL_PREPARING_PREFIX = '.frontron-transaction-journal.preparing-'
export const TRANSACTION_LOCK_PATH = '.frontron-transaction.lock'
export const TRANSACTION_LOCK_PREPARING_PREFIX = '.frontron-transaction.lock.preparing-'
export const TRANSACTION_RECOVERY_LOCK_PATH = '.frontron-transaction-recovery.lock'
export const TRANSACTION_RECOVERY_LOCK_PREPARING_PREFIX =
  '.frontron-transaction-recovery.lock.preparing-'

`
            if (!source.includes(block)) throw new Error('Legacy transaction constant block not found')
            return source.replace(block, '')
          })

          update('frontron/src/doctor.ts', (source) => {
            const importBlock = `import {
  TRANSACTION_JOURNAL_PATH,
  TRANSACTION_JOURNAL_PREPARING_PREFIX,
  TRANSACTION_LOCK_PATH,
  TRANSACTION_LOCK_PREPARING_PREFIX,
  TRANSACTION_RECOVERY_LOCK_PATH,
  TRANSACTION_RECOVERY_LOCK_PREPARING_PREFIX,
} from './transaction-journal'
`
            if (!source.includes(importBlock)) throw new Error('Doctor transaction import block not found')
            source = source.replace(
              importBlock,
              `import { TRANSACTION_JOURNAL_PATH } from './transaction-journal'
`,
            )

            const stateBlock = `const TRANSACTION_STATE_NAMES = new Set([
  TRANSACTION_JOURNAL_PATH,
  TRANSACTION_LOCK_PATH,
  TRANSACTION_RECOVERY_LOCK_PATH,
  '.frontron-transaction.lock.releasing',
  '.frontron-transaction-recovery.lock.releasing',
])

const TRANSACTION_STATE_PREFIXES = [
  TRANSACTION_JOURNAL_PREPARING_PREFIX,
  TRANSACTION_LOCK_PREPARING_PREFIX,
  TRANSACTION_RECOVERY_LOCK_PREPARING_PREFIX,
]

// collectPendingTransactionState 함수는 복구가 필요한 저널과 잠금 파일을 읽기만 한다.
function collectPendingTransactionState(cwd: string) {
  return readdirSync(cwd)
    .filter(
      (entry) =>
        TRANSACTION_STATE_NAMES.has(entry) ||
        TRANSACTION_STATE_PREFIXES.some((prefix) => entry.startsWith(prefix)),
    )
    .sort()
}

// describePendingTransactionState 함수는 발견한 트랜잭션 파일의 역할을 설명한다.
function describePendingTransactionState(entry: string) {
  const isJournal =
    entry === TRANSACTION_JOURNAL_PATH || entry.startsWith(TRANSACTION_JOURNAL_PREPARING_PREFIX)

  return \`Pending transaction \${isJournal ? 'journal' : 'lock'} detected: \${entry}\`
}
`
            const nextStateBlock = `// collectPendingTransactionState 함수는 복구가 필요한 현재 저널만 읽기 전용으로 확인한다.
function collectPendingTransactionState(cwd: string) {
  return readdirSync(cwd).filter((entry) => entry === TRANSACTION_JOURNAL_PATH)
}

function describePendingTransactionState(entry: string) {
  return \`Pending transaction journal detected: \${entry}\`
}
`
            if (!source.includes(stateBlock)) throw new Error('Doctor transaction state block not found')
            return source.replace(stateBlock, nextStateBlock)
          })

          update('frontron/__tests__/doctor.spec.ts', (source) => {
            source = source.replace(
              `import { TRANSACTION_JOURNAL_PATH, TRANSACTION_LOCK_PATH } from '../src/transaction-journal'
`,
              `import { TRANSACTION_JOURNAL_PATH } from '../src/transaction-journal'
`,
            )
            source = source.replace(
              `    const lockPath = join(projectRoot, TRANSACTION_LOCK_PATH)
`,
              '',
            )
            source = source.replace(
              `    const lockSource = 'pending lock sentinel\\n'
`,
              '',
            )
            source = source.replace(
              `    writeFileSync(lockPath, lockSource)
`,
              '',
            )
            source = source.replace(
              `    expect(report).toContain(\`Pending transaction lock detected: \${TRANSACTION_LOCK_PATH}\`)
`,
              '',
            )
            source = source.replace(
              `    expect(readFileSync(lockPath, 'utf8')).toBe(lockSource)
`,
              '',
            )
            return source
          })
          NODE

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          node release.mjs check-metadata

          cd create-frontron
          npm ci --fund=false --audit=false
          npm run lint
          npm run check
          npm run typecheck
          npm test
          npm run build
          npm run test:package-smoke
          cd ..

          cd frontron
          npm ci --fund=false --audit=false
          npm run lint
          npm run check
          npm run typecheck
          npm test
          npm run build
          npm run test:package-smoke
          cd ..

      - name: Commit validated cleanup
        run: |
          VALIDATED_SHA="$(git rev-parse HEAD)" node <<'NODE'
          const fs = require('node:fs')
          fs.writeFileSync(
            '.github/temporary-lock-cleanup-result.json',
            `${JSON.stringify({ status: 0, validatedBaseSha: process.env.VALIDATED_SHA, completedAt: new Date().toISOString() }, null, 2)}\n`,
          )
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            .github/temporary-lock-cleanup-result.json \
            frontron/src/transaction-journal.ts \
            frontron/src/doctor.ts \
            frontron/__tests__/doctor.spec.ts
          git commit -m "refactor: remove obsolete transaction lock paths"
          git push origin HEAD:main
